# Netlify configuration — Ambedo Scaffolding
# This is a plain static site (no build step). Netlify serves the repo root
# and auto-detects the Netlify Forms in index.html and contact.html.

[build]
  publish = "."
  command = ""

# Nice URLs: /services instead of /services.html (optional, both still work)
[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 301

[[redirects]]
  from = "/sidewalk-sheds"
  to = "/sidewalk-sheds.html"
  status = 301

[[redirects]]
  from = "/scaffolding"
  to = "/scaffolding.html"
  status = 301

[[redirects]]
  from = "/bridging"
  to = "/bridging.html"
  status = 301

[[redirects]]
  from = "/gallery"
  to = "/gallery.html"
  status = 301

[[redirects]]
  from = "/faq"
  to = "/faq.html"
  status = 301

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301

# Security & caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
