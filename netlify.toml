# Netlify configuration — Ambedo Holdings
# Static site, no build step. Netlify auto-detects Forms.

[build]
  publish = "."
  command = ""

# Clean URLs
[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 301

[[redirects]]
  from = "/sidewalk-sheds"
  to = "/sidewalk-sheds.html"
  status = 301

[[redirects]]
  from = "/scaffolding"
  to = "/scaffolding.html"
  status = 301

[[redirects]]
  from = "/bridging"
  to = "/sidewalk-sheds.html"
  status = 301

[[redirects]]
  from = "/bridging.html"
  to = "/sidewalk-sheds.html"
  status = 301

[[redirects]]
  from = "/gallery"
  to = "/gallery.html"
  status = 301

[[redirects]]
  from = "/faq"
  to = "/faq.html"
  status = 301

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301

# Security & caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
